{% extends "base.html" %} {% block title %}المرضى - قائمة الحالات{% endblock %}
{% block extra_css %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/patients.css') }}"
/>
{% endblock %} {% block content %}
<div class="container my-4 my-md-5">
  <div class="patients-card">
    <!-- Header -->
    <div class="patients-header">
      <div class="header-content">
        <div class="header-left">
          <h5><i class="fas fa-users me-2"></i>قائمة المرضى</h5>
          <span class="badge bg-light text-dark" id="totalCount">0</span>
        </div>
        <div class="header-right">
          <select id="modelFilter" class="form-select">
            <option value="all">جميع النماذج</option>
            <option value="minimal">النموذج المبسط</option>
            <option value="top8" selected>النموذج المتوسط</option>
            <option value="all11">النموذج الشامل</option>
          </select>
          <button class="btn btn-light" onclick="window.patients.exportData()">
            <i class="fas fa-download"></i> تصدير CSV
          </button>
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="p-3 p-md-4">
      <!-- البحث -->
      <div class="mb-3">
        <input
          type="text"
          id="searchInput"
          class="search-box"
          placeholder="🔍 بحث بالمعرف أو التاريخ..."
        />
      </div>

      <!-- الجدول (للشاشات الكبيرة) -->
      <div class="table-responsive-custom">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>المعرف</th>
              <th>التاريخ</th>
              <th>الوقت</th>
              <th>النتيجة</th>
              <th>الاحتمالية</th>
              <th>النموذج</th>
              <th>تفاصيل</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="7" class="text-center py-5">
                <div class="loading-spinner"></div>
                <p class="mt-2">جاري تحميل البيانات...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- البطاقات (للشاشات الصغيرة) -->
      <div id="mobileCardsContainer"></div>

      <!-- الترقيم والإحصائيات -->
      <div
        class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2"
      >
        <div id="recordCount" class="text-muted small"></div>
        <div id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- نافذة تفاصيل المريض (Modal) -->
<div
  class="modal fade modal-detail"
  id="patientDetailModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div
    class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"
  >
    <div class="modal-content border-0 shadow-lg" style="border-radius: 20px">
      <div class="modal-header border-0">
        <h5 class="modal-title">
          <i class="fas fa-user-circle me-2"></i>تفاصيل المريض
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body" id="patientDetailContent">
        <!-- سيتم ملؤها ديناميكياً -->
      </div>
      <div class="modal-footer border-0">
        <button
          type="button"
          class="btn btn-secondary rounded-pill px-4"
          data-bs-dismiss="modal"
        >
          <i class="fas fa-times me-1"></i> إغلاق
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ✅ كود المرضى (منفصل) -->
<script src="{{ url_for('static', filename='js/patients.js') }}"></script>
{% endblock %}
