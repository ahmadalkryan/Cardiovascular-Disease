{% extends "base.html" %} {% block title %}المرضى - قائمة الحالات{% endblock %}
{% block extra_css %}
<style>
  .search-box {
    border-radius: 50px;
    padding: 10px 20px;
    border: 2px solid #e0e0e0;
    width: 300px;
    transition: all 0.3s;
  }

  .search-box:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  .patients-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
  }

  .patients-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px;
  }

  .table th {
    background: #f8f9fa;
    font-weight: 600;
    white-space: nowrap;
  }

  .table td {
    vertical-align: middle;
  }

  .pagination {
    justify-content: center;
    margin-top: 20px;
  }

  .page-link {
    color: #667eea;
    border-radius: 10px;
    margin: 0 3px;
  }

  .page-link:hover {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
  }

  .page-item.active .page-link {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-color: #667eea;
  }

  .model-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: bold;
  }

  .model-minimal {
    background: #3498db;
    color: white;
  }
  .model-top8 {
    background: #f39c12;
    color: white;
  }
  .model-all11 {
    background: #9b59b6;
    color: white;
  }
  .model-unknown {
    background: #6c757d;
    color: white;
  }

  .status-badge {
    padding: 5px 15px;
    border-radius: 50px;
    font-size: 13px;
  }

  .status-disease {
    background: #dc3545;
    color: white;
  }
  .status-healthy {
    background: #28a745;
    color: white;
  }

  .progress-thin {
    height: 6px;
    border-radius: 10px;
  }

  /* زر التفاصيل */
  .btn-details {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 5px 15px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s;
    white-space: nowrap;
  }

  .btn-details:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    color: white;
  }

  /* نافذة التفاصيل */
  .modal-detail .modal-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 15px 15px 0 0;
  }

  .modal-detail .modal-body {
    padding: 25px;
  }

  .detail-section {
    margin-bottom: 20px;
  }

  .detail-section h6 {
    color: #667eea;
    font-weight: 700;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #e8ebff;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
    background: #f8f9fa;
    transition: background 0.2s;
  }

  .detail-row:hover {
    background: #e8ebff;
  }

  .detail-label {
    font-weight: 600;
    color: #555;
    font-size: 14px;
  }

  .detail-value {
    font-weight: 500;
    color: #2c3e50;
    font-size: 14px;
    text-align: left;
  }

  .detail-value.highlight {
    color: #667eea;
    font-weight: 700;
    font-size: 16px;
  }

  .detail-value.disease {
    color: #e74c3c;
  }

  .detail-value.healthy {
    color: #2ecc71;
  }

  .patient-id-header {
    background: #f8f9fa;
    padding: 10px 15px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 20px;
  }

  .patient-id-header code {
    font-size: 16px;
    color: #667eea;
    font-weight: 700;
  }

  /* شارة التعديل */
  .modified-indicator {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f39c12;
    margin-left: 5px;
    animation: pulse 1.5s ease infinite;
  }

  @keyframes pulse {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.3;
    }
  }

  /* تنسيق خاص للقيم */
  .value-normal {
    color: #2ecc71;
  }
  .value-warning {
    color: #f39c12;
  }
  .value-danger {
    color: #e74c3c;
  }

  @media (max-width: 768px) {
    .search-box {
      width: 100%;
    }
    .patients-header .d-flex {
      flex-direction: column;
      gap: 10px;
    }
    .patients-header .d-flex > div {
      width: 100%;
    }
    .patients-header select {
      width: 100% !important;
    }
    .detail-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .detail-value {
      text-align: right;
    }
  }
</style>
{% endblock %} {% block content %}
<div class="container my-5">
  <div class="patients-card">
    <div class="patients-header">
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <h5 class="mb-0"><i class="fas fa-users me-2"></i>قائمة المرضى</h5>
        <div>
          <select
            id="modelFilter"
            class="form-select d-inline-block w-auto me-2 bg-white"
          >
            <option value="all">جميع النماذج</option>
            <option value="minimal">النموذج المبسط</option>
            <option value="top8" selected>النموذج المتوسط</option>
            <option value="all11">النموذج الشامل</option>
          </select>
          <button class="btn btn-light" onclick="exportData()">
            <i class="fas fa-download"></i> تصدير CSV
          </button>
        </div>
      </div>
    </div>
    <div class="p-4">
      <div class="mb-3">
        <input
          type="text"
          id="searchInput"
          class="search-box"
          placeholder="🔍 بحث بالمعرف أو التاريخ..."
        />
      </div>

      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>المعرف</th>
              <th>التاريخ</th>
              <th>الوقت</th>
              <th>النتيجة</th>
              <th>الاحتمالية</th>
              <th>النموذج</th>
              <th>تفاصيل</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="7" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">جاري تحميل البيانات...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <div id="recordCount" class="text-muted small"></div>
        <div id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============================================ -->
<!-- نافذة تفاصيل المريض (Modal) -->
<!-- ============================================ -->
<div
  class="modal fade modal-detail"
  id="patientDetailModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div
    class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"
  >
    <div class="modal-content border-0 shadow-lg" style="border-radius: 20px">
      <div class="modal-header border-0">
        <h5 class="modal-title">
          <i class="fas fa-user-circle me-2"></i>
          تفاصيل المريض
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body" id="patientDetailContent">
        <!-- سيتم ملؤها ديناميكياً -->
      </div>
      <div class="modal-footer border-0">
        <button
          type="button"
          class="btn btn-secondary rounded-pill px-4"
          data-bs-dismiss="modal"
        >
          <i class="fas fa-times me-1"></i> إغلاق
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let allPatients = [];
  let currentPage = 1;
  const itemsPerPage = 15;

  // ================================================
  // أسماء النماذج
  // ================================================
  const modelNames = {
    minimal: " النموذج المبسط",
    top8: " النموذج المتوسط",
    all11: " النموذج الشامل",
  };

  const modelColors = {
    minimal: "model-minimal",
    top8: "model-top8",
    all11: "model-all11",
  };

  // ================================================
  // الأسماء العربية للميزات السريرية
  // ================================================
  const FEATURES_AR = {
    age: "العمر",
    sex: "الجنس",
    "chest pain type": "نوع ألم الصدر",
    "resting bp s": "ضغط الدم الانقباضي",
    cholesterol: "الكوليسترول",
    "fasting blood sugar": "سكر الدم الصائم",
    "resting ecg": "تخطيط القلب أثناء الراحة",
    "max heart rate": "أقصى معدل لضربات القلب",
    "exercise angina": "ذبحة صدرية أثناء الجهد",
    oldpeak: "انخفاض مقطع ST",
    "ST slope": "ميل مقطع ST",
  };

  // ================================================
  // ترجمة القيم الفئوية
  // ================================================
  const VALUE_TRANSLATIONS = {
    sex: { 0: "أنثى ♀️", 1: "ذكر ♂️" },
    "chest pain type": {
      1: "ذبحة نموذجية",
      2: "ذبحة غير نموذجية",
      3: "ألم غير ذبحي",
      4: "بدون أعراض",
    },
    "fasting blood sugar": { 0: "طبيعي ✅", 1: "مرتفع ⚠️" },
    "resting ecg": {
      0: "طبيعي",
      1: "اضطراب في موجة ST-T",
      2: "تضخم البطين الأيسر",
    },
    "exercise angina": { 0: "لا ❌", 1: "نعم ✅" },
    "ST slope": {
      1: "مائل للأعلى (طبيعي)",
      2: "مسطح (مشبوه)",
      3: "مائل للأسفل (خطير)",
    },
  };

  // ================================================
  // وحدات القياس
  // ================================================
  const UNITS = {
    age: "سنة",
    "resting bp s": "mmHg",
    cholesterol: "mg/dL",
    "max heart rate": "نبضة/دقيقة",
    oldpeak: "ملم",
  };

  // ================================================
  // تحميل البيانات
  // ================================================
  async function loadPatients() {
    const model = document.getElementById("modelFilter").value;
    const search = document.getElementById("searchInput").value;

    try {
      let url = "/api/patients";
      const params = new URLSearchParams();
      if (model !== "all") params.append("model", model);
      if (search) params.append("search", search);
      if (params.toString()) url += "?" + params.toString();

      const response = await fetch(url);
      const data = await response.json();

      if (data.success) {
        allPatients = data.patients || [];
        document.getElementById("recordCount").innerHTML =
          `إجمالي <strong>${allPatients.length}</strong> حالة`;
        renderTable();
      } else {
        throw new Error(data.error || "Failed to load patients");
      }
    } catch (error) {
      console.error("Error loading patients:", error);
      document.getElementById("tableBody").innerHTML = `
        <tr><td colspan="7" class="text-center text-danger py-5">
          <i class="fas fa-exclamation-triangle fa-2x mb-2 d-block"></i>
          <strong>خطأ في تحميل البيانات</strong>
          <p class="small">${error.message}</p>
          <button class="btn btn-outline-danger btn-sm mt-2" onclick="loadPatients()">
            <i class="fas fa-redo"></i> إعادة المحاولة
          </button>
        </td></tr>
      `;
    }
  }

  // ================================================
  // عرض الجدول مع الترقيم
  // ================================================
  function renderTable() {
    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pagePatients = allPatients.slice(start, end);

    const tbody = document.getElementById("tableBody");

    if (pagePatients.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="7" class="text-center py-5">لا توجد بيانات</td></tr>';
      document.getElementById("pagination").innerHTML = "";
      return;
    }

    tbody.innerHTML = pagePatients
      .map((p) => {
        const modelKey = p.model_used || "";
        const modelDisplay = modelNames[modelKey] || modelKey || "-";
        const modelColor = modelColors[modelKey] || "model-unknown";
        const statusClass =
          p.prediction === 1 ? "status-disease" : "status-healthy";
        const statusText =
          p.result_ar || (p.prediction === 1 ? "مريض" : "سليم");

        return `
        <tr>
          <td><code>${p.patient_id || "-"}</code></td>
          <td>${p.date || "-"}</td>
          <td>${p.time || "-"}</td>
          <td>
            <span class="status-badge ${statusClass}">
              ${statusText}
            </span>
          </td>
          <td>
            <div class="d-flex align-items-center gap-2">
              <span class="small fw-bold" style="min-width: 45px;">
                ${((p.probability || 0) * 100).toFixed(1)}%
              </span>
              <div class="progress progress-thin flex-grow-1">
                <div class="progress-bar ${p.prediction === 1 ? "bg-danger" : "bg-success"}" 
                     style="width: ${Math.min((p.probability || 0) * 100, 100)}%"></div>
              </div>
            </div>
          </td>
          <td>
            <span class="model-badge ${modelColor}">
              ${modelDisplay}
            </span>
          </td>
          <td>
            <button class="btn-details" onclick='showPatientDetail(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
              <i class="fas fa-info-circle me-1"></i> تفاصيل
            </button>
          </td>
        </tr>
      `;
      })
      .join("");

    // Pagination
    const totalPages = Math.ceil(allPatients.length / itemsPerPage);
    let paginationHtml = '<ul class="pagination mb-0">';

    paginationHtml += `<li class="page-item ${currentPage === 1 ? "disabled" : ""}">
      <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">&laquo;</a>
    </li>`;

    for (let i = 1; i <= totalPages; i++) {
      if (
        i === 1 ||
        i === totalPages ||
        (i >= currentPage - 2 && i <= currentPage + 2)
      ) {
        paginationHtml += `<li class="page-item ${currentPage === i ? "active" : ""}">
          <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
        </li>`;
      } else if (i === currentPage - 3 || i === currentPage + 3) {
        paginationHtml +=
          '<li class="page-item disabled"><span class="page-link">...</span></li>';
      }
    }

    paginationHtml += `<li class="page-item ${currentPage === totalPages ? "disabled" : ""}">
      <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">&raquo;</a>
    </li>`;
    paginationHtml += "</ul>";

    document.getElementById("pagination").innerHTML = paginationHtml;
  }

  // ================================================
  // عرض تفاصيل المريض في النافذة المنبثقة
  // ================================================
  function showPatientDetail(patient) {
    const content = document.getElementById("patientDetailContent");

    // ترجمة قيمة الجنس
    const sexValue =
      patient.sex !== undefined && patient.sex !== null
        ? VALUE_TRANSLATIONS["sex"][patient.sex] || patient.sex
        : "-";

    // تجميع البيانات السريرية
    const clinicalFeatures = [
      { key: "age", label: FEATURES_AR["age"], unit: UNITS["age"] },
      {
        key: "sex",
        label: FEATURES_AR["sex"],
        isCategorical: true,
        value: sexValue,
      },
      {
        key: "chest pain type",
        label: FEATURES_AR["chest pain type"],
        isCategorical: true,
      },
      {
        key: "resting bp s",
        label: FEATURES_AR["resting bp s"],
        unit: UNITS["resting bp s"],
      },
      {
        key: "cholesterol",
        label: FEATURES_AR["cholesterol"],
        unit: UNITS["cholesterol"],
      },
      {
        key: "fasting blood sugar",
        label: FEATURES_AR["fasting blood sugar"],
        isCategorical: true,
      },
      {
        key: "resting ecg",
        label: FEATURES_AR["resting ecg"],
        isCategorical: true,
      },
      {
        key: "max heart rate",
        label: FEATURES_AR["max heart rate"],
        unit: UNITS["max heart rate"],
      },
      {
        key: "exercise angina",
        label: FEATURES_AR["exercise angina"],
        isCategorical: true,
      },
      { key: "oldpeak", label: FEATURES_AR["oldpeak"], unit: UNITS["oldpeak"] },
      { key: "ST slope", label: FEATURES_AR["ST slope"], isCategorical: true },
    ];

    // بناء صفوف البيانات السريرية
    let clinicalRows = "";
    clinicalFeatures.forEach((feature) => {
      const rawValue = patient[feature.key];

      if (rawValue !== undefined && rawValue !== null && rawValue !== "") {
        let displayValue = rawValue;

        // ترجمة القيم الفئوية
        if (feature.isCategorical && VALUE_TRANSLATIONS[feature.key]) {
          displayValue = VALUE_TRANSLATIONS[feature.key][rawValue] || rawValue;
        }

        // إضافة وحدة القياس
        if (feature.unit && !feature.isCategorical) {
          displayValue = `${rawValue} ${feature.unit}`;
        }

        clinicalRows += `
          <div class="detail-row">
            <span class="detail-label">${feature.label}</span>
            <span class="detail-value">${displayValue}</span>
          </div>
        `;
      }
    });

    // تحديد لون النتيجة
    const isDisease = patient.prediction === 1;
    const resultColor = isDisease ? "disease" : "healthy";
    const resultIcon = isDisease ? "⚠️" : "✅";
    const resultText = patient.result_ar || (isDisease ? "مريض" : "سليم");

    // بناء محتوى النافذة
    content.innerHTML = `
      <!-- معرف المريض -->
      <div class="patient-id-header">
        <i class="fas fa-fingerprint me-2" style="color: #667eea;"></i>
        معرف المريض: <code>${patient.patient_id || "-"}</code>
      </div>

      <!-- معلومات التشخيص -->
      <div class="detail-section">
        <h6><i class="fas fa-stethoscope me-2"></i>معلومات التشخيص</h6>
        <div class="detail-row">
          <span class="detail-label">التاريخ والوقت</span>
          <span class="detail-value">${patient.date || "-"} | ${patient.time || "-"}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">النتيجة</span>
          <span class="detail-value ${resultColor}">${resultIcon} ${resultText}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">نسبة الاحتمالية</span>
          <span class="detail-value highlight">${((patient.probability || 0) * 100).toFixed(1)}%</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">النموذج المستخدم</span>
          <span class="detail-value">${modelNames[patient.model_used] || patient.model_used || "-"}</span>
        </div>
      </div>

      <!-- البيانات السريرية -->
      <div class="detail-section">
        <h6><i class="fas fa-notes-medical me-2"></i>البيانات السريرية</h6>
        ${clinicalRows || '<div class="text-center text-muted py-3">لا توجد بيانات سريرية مسجلة</div>'}
      </div>

      <!-- معلومات إضافية -->
      <div class="detail-section">
        <h6><i class="fas fa-info-circle me-2"></i>معلومات إضافية</h6>
        <div class="detail-row">
          <span class="detail-label">وقت التسجيل الكامل</span>
          <span class="detail-value">${patient.timestamp || "-"}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">معرف النموذج</span>
          <span class="detail-value"><code>${patient.model_used || "-"}</code></span>
        </div>
      </div>
    `;

    // عرض النافذة المنبثقة
    const modal = new bootstrap.Modal(
      document.getElementById("patientDetailModal"),
    );
    modal.show();
  }

  // ================================================
  // تغيير الصفحة
  // ================================================
  function changePage(page) {
    const totalPages = Math.ceil(allPatients.length / itemsPerPage);
    if (page >= 1 && page <= totalPages) {
      currentPage = page;
      renderTable();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }

  // ================================================
  // تصدير البيانات
  // ================================================
  function exportData() {
    const model = document.getElementById("modelFilter").value;
    let url = "/patients/export";
    if (model !== "all") url += `?model=${model}`;
    window.location.href = url;
  }

  // ================================================
  // تحديث البيانات تلقائياً
  // ================================================
  let autoRefreshInterval;

  function startAutoRefresh() {
    autoRefreshInterval = setInterval(loadPatients, 60000);
  }

  function stopAutoRefresh() {
    if (autoRefreshInterval) {
      clearInterval(autoRefreshInterval);
    }
  }

  // ================================================
  // Event Listeners
  // ================================================
  document.getElementById("modelFilter").addEventListener("change", () => {
    currentPage = 1;
    loadPatients();
  });

  document.getElementById("searchInput").addEventListener("keyup", () => {
    currentPage = 1;
    loadPatients();
  });

  // ================================================
  // التهيئة
  // ================================================
  document.addEventListener("DOMContentLoaded", () => {
    loadPatients();
    startAutoRefresh();
  });

  window.addEventListener("beforeunload", stopAutoRefresh);
</script>
{% endblock %}
